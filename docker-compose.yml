services:
  postgres:
    image: postgres:16-alpine
    container_name: wabill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wabill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wabill"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: wabill_bot
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wabill?sslmode=disable
      PROOF_STORAGE_PATH: /data/payment-proofs
    volumes:
      - payment_proofs:/data/payment-proofs

volumes:
  postgres_data:
    name: wabill_postgres_data
  payment_proofs:
    name: wabill_payment_proofs
